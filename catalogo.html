<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FuentesRD Spotter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: white; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        
        header { padding: 20px 5%; border-bottom: 1px solid #5eff00; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .logo { font-size: 1.2rem; font-weight: 650; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; color: #fff; }
        
        .page-container { flex: 1; padding: 20px 5%; max-width: 1200px; margin: auto; width: 100%; }
        
        #grid-autos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .card { background: #111; border: 1px solid #00ff00; padding: 15px; transition: 0.4s; }
        .card:hover { border-color: #39ff14; transform: translateY(-5px); }
        .card img { width: 100%; height: 200px; object-fit: cover; margin-bottom: 15px; display: block; }
        
        button { background: #39ff14; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; color: #000; margin-top: 10px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #050505; border: 1px solid #333; color: white; }
        
        .nav-btn { background: #111; border: 1px solid #39ff14; padding: 8px 15px; color: #39ff14; cursor: pointer; text-transform: uppercase; font-weight: bold; font-size: 0.8rem; }
        
        .page-section { display: none; }
        #view-catalogo { display: block; }
        footer { text-align: center; padding: 20px; border-top: 1px solid #00ff15; color: #3cff00; font-size: 0.7rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo" id="admin-trigger">FuentesRD Spotter</div>
        <nav><button class="nav-btn" onclick="location.reload()">INICIO</button></nav>
    </header>

    <div class="page-container">
        <main id="view-catalogo" class="page-section">
            <div id="admin-panel" style="display:none; border:1px solid #39ff14; padding:15px; margin-bottom:20px;">
                <h2 style="font-size:1rem; color:#39ff14;">ADMIN PANEL</h2>
                <input type="hidden" id="a-id">
                <input type="text" id="a-marca" placeholder="Marca">
                <input type="text" id="a-modelo" placeholder="Modelo">
                <input type="text" id="a-foto" placeholder="URL Foto">
                <input type="text" id="a-desc" placeholder="Descripción">
                <button onclick="guardarAuto()" id="btn-guardar">GUARDAR</button>
            </div>
            <input type="text" id="search" placeholder="Buscar vehículo..." onkeyup="renderizar()">
            <div id="grid-autos"></div>
        </main>

        <section id="view-login" class="page-section">
            <div style="width: 100%; max-width: 300px; margin: 40px auto;">
                <input type="password" id="pass" placeholder="🔑 Clave Admin">
                <button onclick="validarLogin()">AUTENTICAR</button>
            </div>
        </section>
    </div>

    <footer>&copy; 2026 FuentesRD Spotter</footer>

    <script type="module">
        // ... (TU LÓGICA JS PERMANECE EXACTAMENTE IGUAL)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({
            apiKey: "AIzaSyA2cPGLrvQV3lrVij05NebMfyHy9Nd10Ok",
            authDomain: "fr-ss-concesionaria.firebaseapp.com",
            projectId: "fr-ss-concesionaria",
            storageBucket: "fr-ss-concesionaria.firebasestorage.app",
            messagingSenderId: "661326107507",
            appId: "1:661326107507:web:50d639533f646e8d0feb06"
        }));

        let autos = [], esAdmin = false, timer;
        const trigger = document.getElementById('admin-trigger');

        trigger.onmousedown = () => { timer = setTimeout(() => {
            document.querySelectorAll('.page-section').forEach(s => s.style.display = 'none');
            document.getElementById('view-login').style.display = 'block';
        }, 5000); };
        trigger.onmouseup = trigger.onmouseleave = () => clearTimeout(timer);

        async function cargar() {
            const snap = await getDocs(collection(db, "autos"));
            autos = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderizar();
        }

        window.renderizar = () => {
            const term = document.getElementById('search').value.toLowerCase();
            const filtrados = autos.filter(a => (a.marca + " " + a.modelo).toLowerCase().includes(term));
            document.getElementById('grid-autos').innerHTML = filtrados.map(a => `
                <div class="card">
                    <img src="${a.foto}" onerror="this.src='https://via.placeholder.com/400'">
                    <h3>${a.marca} ${a.modelo}</h3>
                    <p style="font-size:0.8rem; color:#888;">${a.desc}</p>
                    ${esAdmin ? `<button onclick="prepararEdicion('${a.id}')" style="background:#ff9900;">EDITAR</button><button onclick="borrar('${a.id}')" style="background:#ff3333;">ELIMINAR</button>` : ''}
                </div>
            `).join('');
        }

        window.validarLogin = () => {
            if(document.getElementById('pass').value === '1234') {
                esAdmin = true;
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-catalogo').style.display = 'block';
                document.getElementById('admin-panel').style.display = 'block';
                renderizar();
            } else { alert('Acceso denegado'); }
        }

        window.prepararEdicion = (id) => {
            const a = autos.find(x => x.id === id);
            document.getElementById('a-id').value = a.id;
            document.getElementById('a-marca').value = a.marca;
            document.getElementById('a-modelo').value = a.modelo;
            document.getElementById('a-foto').value = a.foto;
            document.getElementById('a-desc').value = a.desc;
            document.getElementById('btn-guardar').innerText = "ACTUALIZAR";
        }

        window.guardarAuto = async () => {
            const id = document.getElementById('a-id').value;
            const datos = { marca: document.getElementById('a-marca').value, modelo: document.getElementById('a-modelo').value, foto: document.getElementById('a-foto').value, desc: document.getElementById('a-desc').value };
            if(id) await updateDoc(doc(db, "autos", id), datos); else await addDoc(collection(db, "autos"), datos);
            location.reload();
        }

        window.borrar = async (id) => { if(confirm('¿Eliminar?')) { await deleteDoc(doc(db, "autos", id)); location.reload(); } }

        cargar();
    </script>
</body>
</html>
</html>
